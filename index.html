<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phuket Trip Scrapbook - ASCII Video</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="video-page">
    <header class="mac-navbar" role="banner">
      <div class="mac-navbar-left">
        <img
          class="mac-navbar-logo"
          src="enterpret-logo-mark-black.png"
          alt="Enterpret logo"
        />
        <div class="mac-navbar-menu" aria-label="Page title">Enterpret Phuket Offsite 2026</div>
      </div>
      <div class="mac-navbar-time" id="mac-navbar-time" aria-live="polite">00:00</div>
    </header>

    <pre id="ascii-bg" aria-hidden="true">Loading ASCII video background...</pre>
    <figure class="desktop-folder-icon" aria-label="Memories folder">
      <span class="desktop-folder-glyph" aria-hidden="true"></span>
      <figcaption class="desktop-folder-label">Memories</figcaption>
    </figure>

    <script src="ascii_video_frames_data.js"></script>
    <script src="main.js"></script>
    <script src="photos-manifest.js"></script>
    <script src="photobook.js"></script>
    <script>
      (function updateMacNavbarTime() {
        const timeElement = document.getElementById("mac-navbar-time");
        if (!timeElement) return;

        const setCurrentTime = () => {
          const now = new Date();
          let hours = now.getHours() % 12;
          if (hours === 0) hours = 12;
          const minutes = now.getMinutes();
          const hh = String(hours).padStart(2, "0");
          const mm = String(minutes).padStart(2, "0");
          timeElement.textContent = `${hh}:${mm}`;
        };

        setCurrentTime();
        setInterval(setCurrentTime, 1000);
      })();
    </script>
  </body>
</html>
