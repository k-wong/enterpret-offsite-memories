<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"
      content="Enterpret Phuket Offsite 2026 photobook with retro desktop visuals, ASCII animation, and team memories."
    />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#f4ede0" />

    <link rel="canonical" href="https://k-wong.github.io/enterpret-offsite-memories/" />

    <meta property="og:site_name" content="Enterpret Offsite Memories" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Enterpret Offsite 2026 Photobook" />
    <meta
      property="og:description"
      content="A retro desktop-style photobook capturing Enterpret's Phuket Offsite 2026 memories."
    />
    <meta property="og:url" content="https://k-wong.github.io/enterpret-offsite-memories/" />
    <meta
      property="og:image"
      content="https://cdn.prod.website-files.com/68f131193c06d0856bf03af3/69ac71861268965a57e44283_opengraph.png"
    />
    <meta property="og:image:secure_url" content="https://cdn.prod.website-files.com/68f131193c06d0856bf03af3/69ac71861268965a57e44283_opengraph.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Enterpret Offsite 2026 Photobook" />
    <meta
      name="twitter:description"
      content="A retro desktop-style photobook capturing Enterpret's Phuket Offsite 2026 memories."
    />
    <meta
      name="twitter:image"
      content="https://cdn.prod.website-files.com/68f131193c06d0856bf03af3/69ac71861268965a57e44283_opengraph.png"

    <title>Enterpret Offsite 2026 Photobook</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="video-page">
    <div id="page-loader" class="page-loader" role="status" aria-live="polite">
      <div class="page-loader-inner">
        <img class="page-loader-image" src="loader.png" alt="" aria-hidden="true" />
        <p class="page-loader-text">Loading<span class="page-loader-dots" aria-hidden="true"></span></p>
      </div>
    </div>

    <div class="soundcloud-audio-container" aria-hidden="true">
      <iframe
        id="soundcloud-player"
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A472694880&color=%23ff5500&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false"
        allow="autoplay"
        tabindex="-1"
      ></iframe>
    </div>

    <header class="mac-navbar" role="banner">
      <div class="mac-navbar-left">
        <img
          class="mac-navbar-logo"
          src="enterpret-logo-mark-black.png"
          alt="Enterpret logo"
        />
        <div class="mac-navbar-menu" aria-label="Page title">Enterpret Phuket Offsite 2026</div>
      </div>
      <div class="mac-navbar-right">
        <button id="enable-sound-btn" class="mac-navbar-sound-btn" type="button" aria-label="Enable background video sound">
          ▶
        </button>
        <div class="mac-navbar-time" id="mac-navbar-time" aria-live="polite">00:00</div>
      </div>
    </header>

    <pre id="ascii-bg" aria-hidden="true">Loading ASCII video background...</pre>
    <figure class="desktop-folder-icon" aria-label="Memories folder">
      <span class="desktop-folder-glyph" aria-hidden="true"></span>
      <figcaption class="desktop-folder-label">Memories</figcaption>
    </figure>

    <script src="ascii_video_frames_data.js"></script>
    <script src="main.js"></script>
    <script src="photos-manifest.js"></script>
    <script src="photobook.js"></script>
  </body>
</html>
